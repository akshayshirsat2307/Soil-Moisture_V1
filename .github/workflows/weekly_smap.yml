name: Weekly SMAP RZSM Processing

on:
  schedule:
    # Every Monday at 01:30 UTC, approximately 07:00 IST
    - cron: "30 2 * * 2"

  # Allows manual execution from the GitHub Actions page
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-smap:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    env:
      GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}

      EXPORT_PREFIX: GEE/SMAP_RZSM
      NORMAL_START_YEAR: "2016"
      NORMAL_END_YEAR: "2025"
      EXPORT_SCALE: "9000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly SMAP processing
        run: |
          python run_smap_weekly.py
